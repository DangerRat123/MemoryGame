<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pilgrimage — Location 1 Test</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loading" class="loading">
    <p class="loading-title">Preparing the path</p>
    <p id="loading-progress" class="loading-progress">0 / 0</p>
  </div>

  <section id="scene" class="scene hidden">
    <img id="scene-image" class="scene-image" alt="">

    <!-- Linear screens: one box, bottom center -->
    <div id="box-linear" class="textbox textbox-linear hidden">
      <p id="linear-text" class="textbox-copy"></p>
      <button id="linear-continue" class="continue-btn">Continue</button>
    </div>

    <!-- Choice screens: two boxes, bottom left / bottom right -->
    <div id="box-left" class="textbox textbox-choice textbox-left hidden">
      <p id="left-text" class="textbox-copy"></p>
      <button id="left-continue" class="continue-btn">Continue this way</button>
    </div>

    <div id="box-right" class="textbox textbox-choice textbox-right hidden">
      <p id="right-text" class="textbox-copy"></p>
      <button id="right-continue" class="continue-btn">Continue this way</button>
    </div>

    <!-- End screen -->
    <div id="box-end" class="textbox textbox-linear hidden">
      <p id="end-text" class="textbox-copy"></p>
      <p class="end-label">— end of test path —</p>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
