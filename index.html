<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ex-voto</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loading" class="loading">
    <p class="loading-title">Preparing your path</p>
  </div>

  <section id="screen-title" class="screen hidden">
    <h1 class="title-main">Ex-voto</h1>
    <button id="begin-btn" class="choose-path-btn">Begin</button>
  </section>

  <section id="screen-item-select" class="screen hidden">
    <h1 class="select-title">Choose what you carry</h1>

    <div class="item-select-layout">
      <div id="item-grid" class="item-grid"></div>

      <div class="item-preview">
        <div class="item-preview-canvas-wrap">
          <canvas id="item-preview-canvas" class="item-preview-canvas"></canvas>
          <div id="item-preview-fallback" class="fallback-label hidden"></div>
        </div>
        <p id="item-preview-name" class="item-preview-name">Select an item</p>
      </div>
    </div>

    <button id="bring-item-btn" class="choose-path-btn" disabled>Bring this with you</button>
  </section>

  <section id="screen-location-select" class="screen hidden">
    <h1 class="select-title">Choose your path</h1>

    <div class="carousel-wrapper">
      <button id="carousel-prev" class="carousel-arrow carousel-arrow-left" aria-label="Previous">&#10094;</button>
      <div id="carousel-track" class="carousel-track"></div>
      <button id="carousel-next" class="carousel-arrow carousel-arrow-right" aria-label="Next">&#10095;</button>
    </div>

    <p id="carousel-description" class="carousel-description"></p>
    <button id="choose-path-btn" class="choose-path-btn">Choose this path</button>
  </section>

  <section id="scene" class="scene hidden">
    <canvas id="scene-canvas" class="scene-image"></canvas>

    <div id="inventory-slot" class="inventory-slot hidden">
      <canvas id="inventory-canvas" class="inventory-canvas"></canvas>
      <div id="inventory-fallback" class="fallback-label hidden"></div>
    </div>

    <!-- Linear screens: one box, bottom center -->
    <div id="box-linear" class="textbox textbox-linear hidden">
      <p id="linear-text" class="textbox-copy"></p>
      <button id="linear-continue" class="continue-btn">Continue</button>
    </div>

    <!-- Choice screens: two boxes, bottom left / bottom right -->
    <div id="box-left" class="textbox textbox-choice textbox-left hidden">
      <p id="left-text" class="textbox-copy"></p>
      <button id="left-continue" class="continue-btn">Continue this way</button>
    </div>

    <div id="box-right" class="textbox textbox-choice textbox-right hidden">
      <p id="right-text" class="textbox-copy"></p>
      <button id="right-continue" class="continue-btn">Continue this way</button>
    </div>

    <!-- End screen -->
    <div id="box-end" class="textbox textbox-linear hidden">
      <p id="end-text" class="textbox-copy"></p>
      <p class="end-label">— end of test path —</p>
    </div>
  </section>

  <script src="js/dither.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
